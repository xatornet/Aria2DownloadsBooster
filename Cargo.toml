[package]
name = "aria2-downloads-booster"
version = "1.0.0"
edition = "2021"
description = "Acelerador de descargas (aria2) con interfaz GTK4 para Arch Linux"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Bandeja SNI (StatusNotifierItem + dbusmenu) implementacion de referencia en Rust, probada en Plasma.
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
lto = true
strip = true
