[package]
name = "aria-xtrdownloader"
version = "1.0.0"
edition = "2021"
description = "Acelerador de descargas (aria2) con interfaz GTK4 para Arch Linux"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Bandeja SNI (StatusNotifierItem + dbusmenu) sobre el bus D-Bus de sesión; modo blocking.
zbus = "5.19"

[profile.release]
lto = true
strip = true
